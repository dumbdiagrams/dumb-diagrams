name: Bug report
description: Something is broken or renders wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal `.dgm` source or steps to reproduce
      render: text
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version (`dumbdiagrams --version`)
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: OS, Node.js version, browser (for Studio)
    validations: { required: true }
