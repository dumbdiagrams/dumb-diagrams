name: Rollback editor deployment

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Known-good release tag to redeploy, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  rollback:
    if: github.actor == 'AlexJohnSadowski' && github.triggering_actor == 'AlexJohnSadowski'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ inputs.version }}
