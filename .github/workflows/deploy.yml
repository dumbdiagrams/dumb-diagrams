name: Deploy editor

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (use a previous vX.Y.Z tag to roll back)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEPLOY_REF: ${{ inputs.ref || github.ref }}
    steps:
      - name: Check out deployment ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check synchronized package versions
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:versions

      - name: Check dependency declarations
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:dependencies

      - name: Check catalog inventory
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm icons:check

      - name: Build all packages and editor
        run: pnpm build

      - name: Run unit tests with coverage
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm test:coverage

      - name: Typecheck editor
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm typecheck

      - name: Validate examples and reviewed routing warnings
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check && pnpm check:routing

      - name: Enforce compilation performance budget
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:performance

      - name: Check editor asset budgets
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:assets

      - name: Install Playwright browsers
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm exec playwright install chromium webkit --with-deps

      - name: Run browser and packed CLI Studio journeys
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm test:e2e && pnpm test:e2e:packed

      - name: Smoke test publishable CLI package
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm smoke:package

      - name: Check website
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:website

      - name: Record deployed ref
        run: printf '%s\n' "$DEPLOY_REF" > packages/editor/dist/DEPLOYED_REF

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/editor/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
