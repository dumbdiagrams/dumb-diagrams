name: Deploy editor

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Exact vX.Y.Z release tag to deploy"
        required: true
        type: string
  workflow_call:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.actor == 'AlexJohnSadowski' && github.triggering_actor == 'AlexJohnSadowski'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOY_REF: ${{ inputs.ref || github.ref_name }}
    steps:
      - name: Check out deployment ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact release tag
        env:
          RELEASE_REF: ${{ env.DEPLOY_REF }}
        run: node scripts/validate-release-ref.mjs

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check high-severity dependency advisories
        if: inputs.ref != ''
        run: pnpm check:advisories

      - name: Check synchronized package versions
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:versions

      - name: Check formatting and lint rules
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:style

      - name: Check dependency declarations
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:dependencies

      - name: Check catalog inventory
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm icons:check

      - name: Build all packages and editor
        run: pnpm build

      - name: Run unit tests with coverage
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm test:coverage

      - name: Typecheck editor
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm typecheck

      - name: Validate examples and reviewed routing warnings
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:readability && pnpm check:routing

      - name: Enforce compilation performance budget
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:performance

      - name: Check editor asset budgets
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:assets

      - name: Install Playwright browsers
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm exec playwright install chromium webkit --with-deps

      - name: Run browser and packed CLI Studio journeys
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm test:e2e && pnpm test:e2e:packed

      - name: Smoke test publishable CLI package
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm smoke:package && pnpm check:assets

      - name: Check website
        if: github.event_name == 'push' || inputs.ref == ''
        run: pnpm check:website

      - name: Record deployed ref
        run: printf '%s\n' "$DEPLOY_REF" > packages/editor/dist/DEPLOYED_REF

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: packages/editor/dist

  deploy:
    if: github.actor == 'AlexJohnSadowski' && github.triggering_actor == 'AlexJohnSadowski'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
