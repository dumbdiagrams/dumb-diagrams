name: Publish CLI package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Semver release tag to publish (for example v0.1.0)"
        required: true
        type: string

# Configure the npm trusted publisher for this workflow file and the
# npm-production environment before enabling a release.
permissions:
  contents: read

concurrency:
  group: npm-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || startsWith(inputs.ref, 'v')
    runs-on: ubuntu-latest
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package version
        env:
          RELEASE_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          case "$RELEASE_REF" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a semver tag such as v0.1.0, got $RELEASE_REF" >&2; exit 2 ;;
          esac
          version="$(node -p "require('./packages/cli/package.json').version")"
          test "$version" = "${RELEASE_REF#v}" || {
            echo "Tag $RELEASE_REF does not match CLI package version $version" >&2
            exit 2
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release preflight checks
        run: pnpm check:style && pnpm check:versions && pnpm check:dependencies && pnpm build

      - name: Set npm metadata from repository identity
        run: pnpm publish:metadata

      - name: Prepare standalone package
        run: pnpm --filter create-dumb-diagrams run prepare:standalone

      - name: Pack release artifact
        run: pnpm --dir packages/cli pack --pack-destination ../../.artifacts/packages

      # npm trusted publishing supplies short-lived OIDC credentials and
      # automatically records provenance; no npm token is stored in Actions.
      - name: Publish release artifact
        run: npm publish "$(echo .artifacts/packages/create-dumb-diagrams-*.tgz)" --access public --provenance --registry=https://registry.npmjs.org/
