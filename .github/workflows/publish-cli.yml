name: Publish CLI package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:
    inputs:
      ref:
        description: "Semver release tag to publish (for example v0.1.0)"
        required: true
        type: string

# Configure the npm trusted publisher for this workflow file and the
# npm-production environment before enabling a release.
permissions:
  contents: read

# Queue every event through registry verification, including the approval pause.
# A second event then sees the published version and exits without publishing again.
concurrency:
  group: npm-production
  cancel-in-progress: false
  queue: max

jobs:
  coordinate:
    if: >-
      github.actor == 'AlexJohnSadowski' && github.triggering_actor == 'AlexJohnSadowski' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == github.event.repository.default_branch &&
        github.event.workflow_run.head_repository.id == github.event.repository.id &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.release.outputs.ready }}
      release_ref: ${{ steps.release.outputs.ref }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check out trusted release coordinator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up coordinator Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Resolve an eligible release
        id: release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_RELEASE_REF: ${{ inputs.ref }}
        run: node scripts/coordinate-release.mjs

  prepare:
    needs: coordinate
    if: needs.coordinate.outputs.ready == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_version: ${{ steps.release-version.outputs.version }}
      release_sha: ${{ steps.release-version.outputs.sha }}
      artifact_name: ${{ steps.release-version.outputs.artifact_name }}
      artifact_filename: ${{ steps.artifact.outputs.filename }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.coordinate.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Check npm trusted publishing support
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const npmVersion = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor, patch] = npmVersion.split(".").map(Number);
          if ([major, minor, patch].some((part) => !Number.isInteger(part))) {
            throw new Error(`Could not parse npm version: ${npmVersion}`);
          }
          if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
            throw new Error(`npm ${npmVersion} is too old for trusted publishing; require npm 11.5.1 or later`);
          }
          console.log(`npm ${npmVersion} supports trusted publishing`);
          NODE

      - name: Verify release tag and package version
        id: release-version
        env:
          RELEASE_REF: ${{ needs.coordinate.outputs.release_ref }}
        run: |
          node scripts/validate-release-ref.mjs
          version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("packages/cli/package.json", "utf8")).version)')"
          if [ "$version" != "${RELEASE_REF#v}" ]; then
            echo "Tag $RELEASE_REF does not match CLI package version $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=npm-release-%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test registry verification
        run: node --test scripts/verify-npm-release.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release packages
        run: pnpm build

      - name: Set npm metadata from repository identity
        run: pnpm publish:metadata

      - name: Pack release artifact
        run: pnpm --dir packages/cli pack --pack-destination ../../.artifacts/packages

      - name: Enforce prepared artifact budgets
        run: pnpm check:assets

      - name: Select, checksum, and verify release artifact
        id: artifact
        env:
          RELEASE_VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          artifact="$GITHUB_WORKSPACE/.artifacts/packages/create-dumb-diagrams-${RELEASE_VERSION}.tgz"
          filename="$(basename "$artifact")"
          test -f "$artifact" || {
            echo "Expected exact release artifact at $artifact" >&2
            exit 2
          }
          (
            cd "$(dirname "$artifact")"
            sha256sum "$filename" > "$filename.sha256"
          )
          printf 'path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"
          printf 'filename=%s\n' "$filename" >> "$GITHUB_OUTPUT"

      - name: Smoke test metadata-bearing artifact
        env:
          DUMB_DIAGRAMS_ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: pnpm smoke:package

      - name: Upload verified release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.release-version.outputs.artifact_name }}
          path: |
            .artifacts/packages/${{ steps.artifact.outputs.filename }}
            .artifacts/packages/${{ steps.artifact.outputs.filename }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    needs: [coordinate, prepare]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    environment:
      name: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact prepared commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag is unchanged
        env:
          RELEASE_REF: ${{ needs.coordinate.outputs.release_ref }}
          EXPECTED_RELEASE_SHA: ${{ needs.prepare.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "refs/tags/${RELEASE_REF}^{commit}")"
          if [ "$head_sha" != "$EXPECTED_RELEASE_SHA" ] || [ "$tag_sha" != "$EXPECTED_RELEASE_SHA" ]; then
            echo "Release tag changed after preparation; expected $EXPECTED_RELEASE_SHA, found HEAD=$head_sha tag=$tag_sha" >&2
            exit 1
          fi
          version="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; console.log(JSON.parse(readFileSync("packages/cli/package.json", "utf8")).version)')"
          if [ "$version" != "$RELEASE_VERSION" ]; then
            echo "Prepared version $RELEASE_VERSION does not match checked-out CLI version $version" >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Download verified release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: .artifacts/packages

      - name: Verify artifact checksum and package identity
        id: artifact
        env:
          ARTIFACT_FILENAME: ${{ needs.prepare.outputs.artifact_filename }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          artifact="$GITHUB_WORKSPACE/.artifacts/packages/$ARTIFACT_FILENAME"
          test -f "$artifact" || {
            echo "Downloaded release artifact is missing: $artifact" >&2
            exit 2
          }
          (
            cd "$(dirname "$artifact")"
            sha256sum --check "$ARTIFACT_FILENAME.sha256"
          )
          ARTIFACT="$artifact" node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";

          const manifest = JSON.parse(
            execFileSync("tar", ["-xOzf", process.env.ARTIFACT, "package/package.json"], { encoding: "utf8" }),
          );
          if (manifest.name !== "create-dumb-diagrams" || manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(
              `Downloaded package identity mismatch: ${manifest.name}@${manifest.version}; ` +
                `expected create-dumb-diagrams@${process.env.RELEASE_VERSION}`,
            );
          }
          console.log(`Verified ${manifest.name}@${manifest.version} from the prepared tarball`);
          NODE
          printf 'path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      - name: Check whether this artifact is already published
        id: existing
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          const url = `https://registry.npmjs.org/create-dumb-diagrams/${process.env.RELEASE_VERSION}`;
          const response = await fetch(url, {
            headers: { "Cache-Control": "no-cache", Accept: "application/json" },
            signal: AbortSignal.timeout(30_000),
          });
          if (response.status !== 404 && !response.ok) {
            throw new Error(`Could not check existing npm version: HTTP ${response.status}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.ok}\n`);
          NODE

      - name: Verify existing publication before skipping publish
        if: steps.existing.outputs.exists == 'true'
        env:
          ARTIFACT: ${{ steps.artifact.outputs.path }}
          PACKAGE_NAME: create-dumb-diagrams
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        timeout-minutes: 17
        run: node scripts/verify-npm-release.mjs

      # npm trusted publishing supplies short-lived OIDC credentials and
      # automatically records provenance; no npm token is stored in Actions.
      - name: Publish release artifact
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: npm publish "$ARTIFACT" --access public --provenance --registry=https://registry.npmjs.org/

      - name: Verify published package on npm
        if: steps.existing.outputs.exists != 'true'
        env:
          ARTIFACT: ${{ steps.artifact.outputs.path }}
          PACKAGE_NAME: create-dumb-diagrams
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        timeout-minutes: 17
        run: node scripts/verify-npm-release.mjs
