name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website, links, documentation examples, and payload budget
        run: pnpm check:website
      - name: Check static subdirectory deployment with consent-gated GA4 and Partytown
        run: pnpm build:website && pnpm --filter @dumb-diagrams/website test
        env:
          SITE_URL: https://website.test
          BASE_PATH: /diagrams/
          PUBLIC_GA_MEASUREMENT_ID: G-TEST12345
          PUBLIC_SITE_OPERATOR: Website test operator
          PUBLIC_PRIVACY_EMAIL: privacy@example.test
          PUBLIC_ANALYTICS_RETENTION_MONTHS: "2"

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check synchronized package versions
        run: pnpm check:versions

      - name: Check dependency declarations
        run: pnpm check:dependencies

      - name: Check catalog inventory
        run: pnpm icons:check

      - name: Build all packages and editor
        run: pnpm build

      - name: Run unit tests with coverage
        run: pnpm test:coverage

      - name: Typecheck editor
        run: pnpm typecheck

      - name: Validate examples
        run: pnpm check

      - name: Check reviewed routing warnings
        run: pnpm check:routing

      - name: Enforce compilation performance budget
        run: pnpm check:performance

      - name: Check editor asset budgets
        run: pnpm check:assets

      - name: Smoke test publishable CLI package
        run: pnpm smoke:package

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium webkit --with-deps

      - name: Build editor assets
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Run packed CLI Studio journey
        run: pnpm test:e2e:packed

  cli-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages and editor
        run: pnpm build

      - name: Run CLI unit tests
        run: pnpm exec vitest run packages/cli/src

      - name: Smoke test publishable CLI package
        run: pnpm smoke:package
