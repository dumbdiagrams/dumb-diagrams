name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    if: contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.actor) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check website, links, documentation examples, and payload budget
        run: pnpm check:website
      - name: Install website test browser
        run: pnpm exec playwright install chromium --with-deps
      - name: Check documentation interactions in Chromium
        run: pnpm --filter @dumb-diagrams/website test:e2e --project=chromium
      - name: Check static subdirectory deployment with consent-gated GA4 and Partytown
        run: pnpm build:website && pnpm --filter @dumb-diagrams/website test
        env:
          SITE_URL: https://website.test
          BASE_PATH: /diagrams/
          PUBLIC_GA_MEASUREMENT_ID: G-TEST12345
          PUBLIC_SITE_OPERATOR: Website test operator
          PUBLIC_PRIVACY_EMAIL: privacy@example.test
          PUBLIC_ANALYTICS_RETENTION_MONTHS: "2"

  verify:
    if: contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.actor) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, build, test with coverage, and check every baseline
        run: pnpm ci:verify

      - name: Ensure build left no uncommitted changes
        run: git diff --exit-code

  e2e:
    if: contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.actor) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Build, run Playwright tests, and run the packed CLI Studio journey
        run: pnpm ci:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: .artifacts/playwright/
          if-no-files-found: ignore

  cli-windows:
    if: contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.actor) && contains(fromJSON(vars.CI_ALLOWED_ACTORS || '["AlexJohnSadowski"]'), github.triggering_actor)
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check style and line endings
        run: pnpm check:style

      - name: Build all packages and editor
        run: pnpm build

      - name: Run CLI unit tests
        run: pnpm exec vitest run packages/cli/src

      - name: Smoke test publishable CLI package
        run: pnpm smoke:package
